      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotal_minor: { $ref: '#/components/schemas/OrderMinorUnits' }
        order_discount_minor: { $ref: '#/components/schemas/OrderMinorUnits' }
        discount_total_minor: { $ref: '#/components/schemas/OrderMinorUnits' }
        order_tax_rate_basis_points: { $ref: '#/components/schemas/OrderTaxRateBasisPoints' }
        tax_total_minor: { $ref: '#/components/schemas/OrderMinorUnits' }
        grand_total_minor: { $ref: '#/components/schemas/OrderMinorUnits' }
        id: { type: integer, format: int64, minimum: 1 }
        order_number: { type: string, maxLength: 40 }
        customer_id: { type: integer, format: int64, minimum: 1 }
        assignee_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        order_date: { type: string, format: date }
        priority: { $ref: '#/components/schemas/OrderPriority' }
        status: { type: string, enum: [draft, pending, confirmed, processing, ready, completed, cancelled] }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        customer:
