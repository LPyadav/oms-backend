openapi: '3.1.0'

info:
  title: OMS Backend API
  version: '0.1.0'
  description: |
    Order Management System health, authentication, access administration, customer management, product catalog, order, and notification endpoints.

    All registered API routes share a default limit of 120 requests per
    minute per client IP. Requests rejected for missing or invalid
    authentication also count toward this quota.

    Login applies two additional limits: 30 requests per minute per IP
    and 5 requests per minute per normalized email across IPs. Email
    normalization trims whitespace and lowercases the value.

    Deployments can configure these limits with RATE_LIMIT_API_PER_IP,
    RATE_LIMIT_LOGIN_PER_IP, and RATE_LIMIT_LOGIN_PER_EMAIL.
    On HTTP 429, wait for the number of seconds in Retry-After.

servers:
  - url: http://127.0.0.1:8000
    description: Local development

security:
  - BearerAuth: []

paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getApiHealth
      summary: Check API health
      security: []
      responses:
        '200':
          description: API health check succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Issue a Bearer token
      description: |
        Reads credentials from the request body. A successful login
        returns an opaque Sanctum token, its expiry, and the public user
        profile. The token lifetime defaults to 60 minutes and is
        configurable through SANCTUM_TOKEN_EXPIRATION_MINUTES.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: reviewer@example.test
              password: '<local-password>'
              device_name: OMS Web
      responses:
        '200':
          description: Login succeeded and a token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated user
      responses:
        '200':
          description: Current user's public profile, roles, and effective permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current Bearer token
      description: Revokes the token used for this request. Other device tokens remain valid until their own expiry or revocation.
      responses:
        '200':
          description: The current token was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users:
    get:
      tags: [Admin Users]
      operationId: listAdminUsers
      summary: List users
      description: Requires an active Admin with the users.manage permission. Users are ordered by ID.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
          description: Literal name or email substring.
        - name: is_active
          in: query
          schema: { type: integer, enum: [0, 1] }
        - name: role
          in: query
          schema: { type: string }
          description: Exact role name.
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: One-based page number.
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1 }
          description: >
            Deployment defaults are 25 users per page and a maximum of 100.
            Configured through PAGINATION_USERS_DEFAULT_PER_PAGE and PAGINATION_USERS_MAX_PER_PAGE.
      responses:
        '200':
          description: A page of users and its pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: One or more pagination query parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Admin Users]
      operationId: createAdminUser
      summary: Create a user
      description: Requires an active Admin with the users.manage permission. New users are active with empty role lists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUserRequest'
      responses:
        '201':
          description: The user was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateUserEmail'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users/{user}:
    get:
      tags: [Admin Users]
      summary: Get one user for the account editor
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: User detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    patch:
      tags: [Admin Users]
      operationId: updateAdminUser
      summary: Update a user's profile
      description: >
        Requires an active Admin with the users.manage permission.
        Authorization is checked before the target user is looked up.
        Updates only the profile fields supplied in the body.
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: User ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The user's profile was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/DuplicateUserEmail'
        '422':
          description: One or more profile fields in the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users/{user}/disable:
    patch:
      tags: [Admin Users]
      operationId: disableAdminUser
      summary: Disable a user account
      description: >
        Requires an active Admin with the users.manage permission.
        Authorization is checked before the target user is looked up.
        Disables the account and revokes all of the user's existing Bearer tokens.
        A status change and its audit event are saved in the same transaction.
        The request body can be omitted.
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: User ID.
      responses:
        '200':
          description: The account was disabled and its tokens were revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminUserResponse'
                  - properties:
                      data:
                        properties:
                          user:
                            properties:
                              is_active: { const: false }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/LastActiveAdminConflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users/{user}/enable:
    patch:
      tags: [Admin Users]
      operationId: enableAdminUser
      summary: Reactivate a user account
      description: >-
        Requires an active Admin with the users.manage permission.
        Reactivation preserves assigned roles and revokes any tokens still attached
        to the disabled account. The user signs in again to get a new token.
        The status and its audit event are saved together. An already active
        account is returned unchanged. The request body can be omitted.
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: User ID.
      responses:
        '200':
          description: The active user account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminUserResponse'
                  - properties:
                      data:
                        properties:
                          user:
                            properties:
                              is_active: { const: true }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users/{user}/roles:
    patch:
      tags: [Admin Users]
      operationId: assignAdminUserRoles
      summary: Replace a user's assigned roles
      description: >-
        Requires an active Admin with both the users.manage and roles.manage
        permissions. Authorization runs before the target user is looked up.
        Replaces the entire role set with the supplied role names. An empty list
        clears all assigned roles when permitted. Each change records the acting
        Admin, target user, and before and after role sets in the same transaction.
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: User ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRolesRequest'
            examples:
              replace:
                summary: Replace the user's roles
                value:
                  roles: [manager, staff]
              clear:
                summary: Clear all assigned roles
                value:
                  roles: []
      responses:
        '200':
          description: The target user with their resulting roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/LastActiveAdminConflict'
        '422':
          description: The roles list in the request body is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users/{user}/permissions:
    parameters:
      - name: user
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
        description: User ID.
    get:
      tags: [Admin Users]
      operationId: showAdminUserPermissions
      summary: Get a user's direct and inherited permissions
      description: Requires an active Admin with both the users.manage and roles.manage permissions.
      responses:
        '200':
          description: The target user's direct and role-inherited permission keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPermissionsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Admin Users]
      operationId: assignAdminUserPermissions
      summary: Replace a user's direct permissions
      description: >-
        Requires an active Admin with both the users.manage and roles.manage
        permissions. An empty list clears all direct grants. Role-inherited
        permissions remain effective. Each change is audited in the same
        transaction and repeating the same set creates no additional entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserPermissionsRequest'
            examples:
              replace:
                summary: Replace direct grants
                value:
                  direct_permissions: [products.view]
              clear:
                summary: Clear direct grants
                value:
                  direct_permissions: []
      responses:
        '200':
          description: The target user's resulting direct and inherited permission keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPermissionsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/roles:
    get:
      tags: [Admin Roles]
      operationId: listAdminRoles
      summary: List roles
      description: Requires an active Admin with the roles.manage permission. Roles in the application's guard are ordered by ID.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: One-based page number.
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1 }
          description: >-
            Deployment defaults are 25 roles per page and a maximum of 100.
            Configured through PAGINATION_ROLES_DEFAULT_PER_PAGE and PAGINATION_ROLES_MAX_PER_PAGE.
      responses:
        '200':
          description: A page of roles with their permissions and pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoleListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: One or more pagination query parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Admin Roles]
      operationId: createAdminRole
      summary: Create a custom role
      description: >-
        Requires an active Admin with the roles.manage permission.
        A new role starts with no permissions. The creation is audited in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleNameRequest'
      responses:
        '201':
          description: The custom role was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoleResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateRoleName'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/roles/{role}:
    parameters:
      - $ref: '#/components/parameters/AdminRoleId'
    patch:
      tags: [Admin Roles]
      operationId: renameAdminRole
      summary: Rename a custom role
      description: >-
        Requires an active Admin with the roles.manage permission.
        Authorization runs before the target role is looked up.
        Renaming preserves permissions and user assignments and records the old and new names in the same transaction.
        Submitting the current name leaves the role and its audit history unchanged.
        The built-in admin, manager, and staff roles are protected from renaming.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleNameRequest'
      responses:
        '200':
          description: The role with its current name and permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoleResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/DuplicateRoleName'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/roles/{role}/permissions:
    parameters:
      - $ref: '#/components/parameters/AdminRoleId'
    patch:
      tags: [Admin Roles]
      operationId: replaceAdminRolePermissions
      summary: Replace a role's selected permissions
      description: >-
        Requires an active Admin with the roles.manage permission.
        Authorization runs before the target role is looked up.
        Replaces the complete checked set for the Manager, Staff, or a custom role.
        Omitted grants are removed from the role. An empty array clears its grants.
        Each change records the acting Admin, role, and before and after permissions
        in the same transaction. Saving the current set leaves the audit history
        unchanged. The built-in Admin role's grants are protected.
        Existing Admin-only grants on editable roles may be kept or removed.
        Adding a new Admin-only grant to an editable role returns 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRolePermissionsRequest'
            examples:
              replace:
                summary: Replace the role's permissions
                value:
                  permissions: [orders.create, orders.assign]
              clear:
                summary: Clear the role's permissions
                value:
                  permissions: []
      responses:
        '200':
          description: The role with its resulting permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoleResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          description: The permissions list is missing, malformed, contains invalid names, or adds an Admin-only grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/permissions:
    get:
      tags: [Admin Roles]
      operationId: listAdminPermissions
      summary: List the permission catalog
      description: >-
        Requires an active Admin with the roles.manage permission.
        Returns all permission names for the application's guard.
        Use each role's permissions array to determine the checked options.
        Admin-only keys are identified for display on editable roles.
      responses:
        '200':
          description: The permission catalog and its Admin-only subset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPermissionListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers
      description: Requires an active user with customers.view. Customers are ordered by ID.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
          description: Literal substring search across name, email, and phone.
        - name: is_active
          in: query
          schema: { type: integer, enum: [0, 1] }
          description: Filter by inactive (0) or active (1) customers. Omit to include both.
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: One-based page number.
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1 }
          description: >-
            Deployment defaults are 25 customers per page and a maximum of 100.
            Configured through PAGINATION_CUSTOMERS_DEFAULT_PER_PAGE and PAGINATION_CUSTOMERS_MAX_PER_PAGE.
      responses:
        '200':
          description: A page of customers and its pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      description: >-
        Requires an active Admin with customers.manage.
        The customer starts active. Creation and its audit entry are saved together.
        Supplying is_active in the request body returns 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCustomerRequest'
      responses:
        '201':
          description: The customer was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/CatalogWriteContention'

  /api/customers/{customer}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get a customer
      description: Requires an active user with customers.view. Authorization precedes customer lookup.
      responses:
        '200':
          description: The customer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update a customer profile
      description: >-
        Requires an active Admin with customers.manage.
        Authorization precedes customer lookup. At least one supported profile field is required.
        Send null to clear a contact field. Changed fields are audited in the same transaction.
        Supplying is_active in the request body returns 422. Use the deactivate endpoint to change status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: The current customer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/CatalogWriteContention'

  /api/customers/{customer}/deactivate:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    patch:
      tags: [Customers]
      operationId: deactivateCustomer
      summary: Deactivate a customer
      description: >-
        Requires an active Admin with customers.manage.
        Authorization precedes customer lookup. The customer record remains available.
        The status change is audited. Repeating deactivation returns the inactive record.
      responses:
        '200':
          description: The inactive customer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/CatalogWriteContention'

  /api/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List visible orders
      description: >-
        Requires orders.view.any or orders.view.assigned. Assigned-only readers are scoped to their own orders.
        Orders can be searched, filtered, and sorted within the caller's access scope.
        Dates are inclusive. The default order is order_date descending, then ID descending.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
          description: >-
            Match a literal substring of the order number, customer name, product snapshot name or SKU, or assigned employee name.
            Customer email is searched only for orders where the caller can view customer contact details.
            Every term uses substring matching. Use the separate order_number or sku parameters to opt into exact filters.
        - name: order_number
          in: query
          schema: { type: string, minLength: 1, maxLength: 40 }
          description: >-
            Exact order number under the stored column collation. Surrounding whitespace is trimmed.
            A supplied value must be a non-blank scalar string. It combines with search and other filters using AND within the caller’s order scope.
        - name: sku
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
          description: >-
            Exact saved order-item SKU under the stored column collation. Surrounding whitespace is trimmed.
            A supplied value must be a non-blank scalar string. An order counts once even when multiple items match.
            It combines with search and other filters using AND within the caller’s order scope.
        - name: status
          in: query
          schema: { type: string, enum: [draft, pending, confirmed, processing, ready, completed, cancelled] }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/OrderPriority' }
        - name: customer_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
          description: Match the customer ID.
        - name: assignee_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
          description: Match the assigned employee ID.
        - name: date_from
          in: query
          schema: { type: string, format: date }
          description: Include orders on or after this business date.
        - name: date_to
          in: query
          schema: { type: string, format: date }
          description: Include orders on or before this business date. Must be on or after date_from if both are supplied.
        - name: sort
          in: query
          schema: { type: string, enum: [order_date, total, status, priority, customer], default: order_date }
          description: >-
            Total uses stored grand total in minor units for the configured business currency.
            Customer uses its current name. Ascending status order is Draft, Pending,
            Confirmed, Processing, Ready, Completed, Cancelled. Ascending priority is Low, Normal, High, Urgent.
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
          description: Sort direction also applies to the order ID tie-breaker.
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1 }
          description: The deployment default and maximum are configurable.
      responses:
        '200':
          description: List visible orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create a draft order
      description: >-
        Requires orders.view.any and orders.create. A non-null assignee requires orders.assign, and a non-null note requires
        orders.notes.create.any. An explicit item tax rate or a non-null order tax rate also requires orders.update.
        A request with order_tax_rate_basis_points must omit item tax overrides.
        The server snapshots active catalog products, derives all amounts, and saves the draft, lines, optional note, audit,
        and idempotency record atomically. The key is scoped to the authenticated user and stays bound to the original order.
        A retry with the same key and equivalent validated payload returns the current order details after the required permissions
        are checked again. Object field order does not affect equivalence. Omitted optional fields use their defaults and item order matters.
        An explicit numeric tax rate, including zero, is part of the idempotency payload. A rolled-back creation leaves the key available for retry.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Send exactly one unique key for each new order and reuse it for retries of that order.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{1,128}$'
          example: 798b73b5-f7a5-4d6a-875d-644cbbe34312
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created a draft order or returned the current details of the same order for an authorized replay.
          headers:
            Location:
              description: The same relative order URL on the initial response and on replay.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/OrderIdempotencyConflict'
        '422':
          description: The JSON body or Idempotency-Key header failed validation. Header errors use errors.fields.idempotency_key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/OrderWriteContention'

  /api/orders/preview:
    post:
      tags: [Orders]
      operationId: previewOrderPricing
      summary: Calculate an order pricing preview
      description: >-
        Supply the full item list. A new-order preview requires create access and defaults to zero order-wide discount.
        Supply order_id with update access to reuse existing snapshots, the saved discount, and the saved order tax mode.
        An explicit discount overrides the saved amount. A numeric tax override requires orders.update.
        A null order tax rate uses the saved base tax rates for existing lines and catalog rates for new lines.
        Omit item tax overrides when an order tax rate is supplied or remains in effect.
        Preview has no side effects. Order creation and updates recalculate totals on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPricingPreviewRequest'
      responses:
        '200':
          description: Calculate an order pricing preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPricingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/orders/assignees:
    get:
      tags: [Orders]
      operationId: listOrderAssignees
      summary: List assignable employees
      description: >-
        Requires an active user with orders.view.any and orders.assign.
        Returns only the ID and name of active users, ordered by case-insensitive name and then ID.
        Order creation and assignment revalidate the new assignee during the write transaction.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
          description: Match a literal case-insensitive substring of the name. Whitespace is trimmed and blank values are ignored.
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
          description: Defaults to 25 with a maximum of 100. Both limits are configurable.
      responses:
        '200':
          description: Assignable employees retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAssigneeListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/orders/{order}:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
        description: Order ID.
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get a visible order
      description: >-
        Returns customer and assignee details, priced item snapshots, notes, status history, assignment history,
        and recent system activity.
        An order outside the caller's assigned scope is returned as unavailable.
      responses:
        '200':
          description: Get a visible order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Orders]
      operationId: updateOrder
      summary: Update an editable order
      description: >-
        Requires orders.view.any and orders.update. Draft and pending orders are editable.
        Provide expected_version and at least one writable field.
        If items are supplied they replace the whole item list in the submitted sequence.
        Existing products retain their price, name, SKU, and base tax rate snapshots. Omitting the order rate retains the saved tax mode.
        Send order_tax_rate_basis_points with expected_version to edit tax using the saved items. A null rate restores the saved base rates.
        Omit item tax overrides when an order tax rate is supplied or remains in effect. Omitting the order discount retains the saved amount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Update an editable order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/OrderVersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/OrderWriteContention'

    delete:
      tags: [Orders]
      operationId: deleteOrder
      summary: Soft-delete an eligible order
      description: >-
        Requires an active Admin with orders.view.any and orders.delete.
        Draft, pending, and cancelled orders are eligible. Item and note records remain available for historical retention.
      parameters:
        - name: expected_version
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Soft-delete an eligible order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDeletedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/OrderVersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/OrderWriteContention'

  /api/orders/{order}/status:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [Orders]
      operationId: changeOrderStatus
      summary: Change the order status
      description: >-
        A caller with orders.view.any and orders.status.update.any can advance one
        step through Draft, Pending, Confirmed, Processing, Ready, and Completed,
        or cancel a nonterminal order. Assigned-only status permission permits
        Confirmed to Processing and Processing to Ready on assigned orders.
        Confirmation requires active products and sufficient stock. Eligible
        cancellation reverses actual deductions. Status, stock movements,
        history, and audit are committed in a single transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrderStatusRequest'
            example:
              status: confirmed
              expected_version: 2
              remarks: Order approved for fulfillment.
      responses:
        '200':
          description: The updated order with its status history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/OrderVersionConflict'
        '422':
          description: Invalid request or transition, inactive product, insufficient stock, or a restoration beyond the stock limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/OrderWriteContention'

  /api/orders/{order}/assign:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [Orders]
      operationId: assignOrder
      summary: Assign or unassign an order
      description: >-
        Requires orders.view.any and orders.assign. The assignee must be active
        when changing the assignment. Send null to unassign. Completed and cancelled
        orders reject assignment changes. An unchanged assignment preserves the
        order version and writes no additional audit entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignOrderRequest'
      responses:
        '200':
          description: The order with its current assignment and history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/OrderVersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/OrderWriteContention'

  /api/orders/{order}/notes:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [Orders]
      operationId: addOrderNote
      summary: Append an order note
      description: >-
        All-orders note access requires orders.view.any and orders.notes.create.any.
        Assigned-only note access requires orders.view.assigned and orders.notes.create.assigned.
        Notes are append-only. The author comes from the authenticated caller.
        Adding a note preserves the order version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreOrderNoteRequest'
      responses:
        '201':
          description: The new order note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNoteCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/OrderWriteContention'

  /api/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List visible notifications
      description: >-
        Returns the caller's notifications for non-deleted orders still assigned to the caller.
        Visibility requires a current order read permission (orders.view.any or orders.view.assigned).
        With no visible notifications, the list is empty. Results are sorted by notification ID descending.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [read, unread] }
          description: Filter by read status. Omit to include both statuses.
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: >-
            One-based page number. The upper bound is the platform integer limit divided by
            the configured maximum page size, rounded down.
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1 }
          description: >-
            Defaults to 25 notifications per page, with a maximum of 100.
            Deployments can set PAGINATION_NOTIFICATIONS_DEFAULT_PER_PAGE and PAGINATION_NOTIFICATIONS_MAX_PER_PAGE.
      responses:
        '200':
          description: A page of visible notifications and its pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getUnreadNotificationCount
      summary: Count visible unread notifications
      description: >-
        Counts all unread notifications in the same visibility scope as the notification list.
        Returns zero when the caller has no visible unread notifications.
      responses:
        '200':
          description: The visible unread notification count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNotificationUnreadCountResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all visible notifications as read
      description: >-
        Marks all unread notifications in the same visibility scope as the notification list.
        Returns the number changed. Previously read notifications keep their original read timestamp.
      responses:
        '200':
          description: The number of visible notifications marked as read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNotificationsMarkedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/notifications/{notification}/read:
    parameters:
      - name: notification
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
        description: Notification ID.
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a visible notification as read
      description: >-
        Uses the same visibility scope as the notification list. Missing notifications and those outside the
        caller's visibility return 404. Repeating the request preserves the original read timestamp.
      responses:
        '200':
          description: The visible notification with its read timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Get dashboard KPIs and recent orders
      description: >-
        Requires dashboard.view and orders.view.any. Counts and recent orders use
        all live orders. Revenue and average order value use stored grand totals
        including tax for completed orders with a completion timestamp.
        Financial metrics are grouped by the currency saved on each order.
        Total revenue is an exact decimal string in minor currency units.
        Customer and product counts include active and inactive records and are
        null when the corresponding catalog read grant is absent.
      responses:
        '200':
          description: Dashboard metrics and recent orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/dashboard/revenue-trend:
    get:
      tags: [Dashboard]
      operationId: getDashboardRevenueTrend
      summary: Get completed order revenue over time
      description: >-
        Requires dashboard.view and orders.view.any. Each order contributes to
        the period containing the local date of its completion timestamp in
        the reporting timezone. Weeks begin on Monday and partial periods
        are clipped to the requested dates. The response preserves the
        requested calendar dates, including dates skipped in that timezone.
        A daily bucket for a skipped date is empty. Empty buckets have revenue
        "0" and zero completed orders.
      parameters:
        - name: group_by
          in: query
          schema: { type: string, enum: [day, week, month], default: day }
        - name: date_from
          in: query
          schema: { type: string, format: date }
          description: >-
            Inclusive start date. Supply both date_from and date_to or omit both.
            The default range contains the last 30 local calendar days, including today.
        - name: date_to
          in: query
          schema: { type: string, format: date }
          description: >-
            Inclusive end date. The requested range must contain at most 366
            calendar days by default.
      responses:
        '200':
          description: Completed order revenue grouped by calendar period and currency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardRevenueTrendResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /api/reports/orders:
    get:
      tags: [Reports]
      operationId: getOrderFulfillmentReport
      summary: Get the Order and Fulfillment report
      description: >-
        Requires an active account with reports.view and orders.view.any.
        Filter by the stored business order date, status, customer, or
        assignee. Results exclude soft-deleted orders and include every
        matching status, including cancelled orders when matched. Rows use
        order date descending, then order ID descending. The rows, pagination
        total, and amounts for all matching orders are evaluated in the same
        database read snapshot. Use a row ID with GET /api/orders/{order} for
        order details.
      parameters:
        - name: date_from
          in: query
          schema: { type: string, format: date }
          description: >-
            Inclusive start of the business order-date range. Supply both
            date_from and date_to or omit both. The default range contains
            the last 30 calendar days in the reporting timezone, including today.
            Skipped local dates still count toward the span.
        - name: date_to
          in: query
          schema: { type: string, format: date }
          description: >-
            Inclusive end of the business order-date range. The default
            maximum span is 366 calendar days.
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending, confirmed, processing, ready, completed, cancelled]
          description: Filter by current order status.
        - name: customer_id
          in: query
          schema: { type: integer, minimum: 1 }
          description: Filter by the customer ID stored on the order.
        - name: assignee_id
          in: query
          schema: { type: integer, minimum: 1 }
          description: Filter by the current assignee ID.
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: One-based page number.
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          description: Requested page size. Deployment configuration can set lower limits.
      responses:
        '200':
          description: Matching order rows, all-filter totals by currency, and snapshot metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderFulfillmentReportResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/reports/sales-tax:
    get:
      tags: [Reports]
      operationId: getSalesTaxReport
      summary: Get the Sales and Tax report
      description: >-
        Requires an active account with reports.view and orders.view.any.
        Includes non-deleted completed orders with a recorded completion time.
        Uses saved order pricing and tax amounts, including historical orders
        whose product records have since changed. The local date of completed_at
        must fall within the requested range. A range containing only skipped
        dates in the reporting timezone returns no orders and preserves the
        date filters. Rows use completion time descending, then order ID
        descending. Page rows, pagination count, and all-filter currency
        totals share one database read snapshot.
      parameters:
        - name: date_from
          in: query
          schema: { type: string, format: date }
          description: >-
            Inclusive local start date. Supply both date_from and date_to or
            omit both. The default window is the last 30 local calendar days,
            including today. Skipped local dates still count toward the span.
            Supported dates run from 1000-01-02 through 9999-12-30.
        - name: date_to
          in: query
          schema: { type: string, format: date }
          description: >-
            Inclusive local end date. The default maximum span is 366
            calendar days.
        - name: customer_id
          in: query
          schema: { type: integer, minimum: 1 }
          description: Filter by the customer ID stored on the order.
        - name: product_id
          in: query
          schema: { type: integer, minimum: 1 }
          description: >-
            Select orders that contain this product ID. Each matching order
            contributes once, with the full order's stored amounts.
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: One-based page number.
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          description: Requested page size. Deployment configuration can set lower limits.
      responses:
        '200':
          description: Matching completed-order rows, all-filter currency totals, and snapshot metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesTaxReportResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products
      description: Requires an active user with products.view. Products are ordered by ID.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
          description: Literal substring search across name and SKU.
        - name: is_active
          in: query
          schema: { type: integer, enum: [0, 1] }
          description: Filter by inactive (0) or active (1) products. Omit to include both.
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: One-based page number.
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1 }
          description: >-
            Deployment defaults are 25 products per page and a maximum of 100.
            Configured through PAGINATION_PRODUCTS_DEFAULT_PER_PAGE and PAGINATION_PRODUCTS_MAX_PER_PAGE.
      responses:
        '200':
          description: A page of products and its pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      description: >-
        Requires an active Admin with products.manage. The product starts active
        with stock quantity and stock version both set to 0. Creation and its
        audit entry are saved together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProductRequest'
            example:
              sku: WIDGET-01
              name: Steel Widget
              price: '249.95'
              tax_rate: '18.00'
      responses:
        '201':
          description: The product was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateProductSku'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/CatalogWriteContention'

  /api/products/{product}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product
      description: Requires an active user with products.view. Authorization precedes product lookup.
      responses:
        '200':
          description: The product and its current stock balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Update product details
      description: >-
        Requires an active Admin with products.manage. Authorization precedes
        product lookup. Send at least one product detail in the body. Changed
        fields are audited in the same transaction. Use the stock and deactivate
        endpoints to change the balance and active status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: The current product details and stock balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/DuplicateProductSku'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/CatalogWriteContention'

  /api/products/{product}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    patch:
      tags: [Products]
      operationId: deactivateProduct
      summary: Deactivate a product
      description: >-
        Requires an active Admin with products.manage. Authorization precedes
        product lookup. Deactivation preserves the product and its stock balance.
        The status change is audited. Repeating deactivation returns the inactive record.
      responses:
        '200':
          description: The inactive product and its current stock balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/CatalogWriteContention'

  /api/products/{product}/stock:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    patch:
      tags: [Products]
      operationId: adjustProductStock
      summary: Set the counted stock quantity
      description: >-
        Requires an active Admin with products.manage. Authorization precedes product
        lookup. Send the absolute counted quantity and the stock version from the
        current product response. A changed quantity increments the version and
        records a signed stock movement in the same transaction. An unchanged quantity
        with the current version succeeds without a movement. On a version conflict,
        reload the product and reconcile the count before submitting again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustProductStockRequest'
            example:
              stock_quantity: 12
              expected_stock_version: 0
              reason: Physical count
      responses:
        '200':
          description: The product with the current stock balance and version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/StaleProductStockVersion'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/CatalogWriteContention'

  /api/me/password:
    patch:
      tags: [Authentication]
      summary: Change the current account password and revoke its API tokens
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string, format: password }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        '200':
          description: Password changed. Sign in again with the new password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/customers/{customer}/order-summary:
    get:
      tags: [Customers]
      summary: Get a customer's order counts, lifetime values, and recent orders
      security: [{ bearerAuth: [] }]
      parameters:
        - name: customer
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Orders in the current account's order scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerOrderSummaryResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  /api/admin/access-audit-logs:
    get:
      tags: [Audit]
      summary: List access audit records, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: action, in: query, schema: { type: string, maxLength: 64 } }
        - { name: actor_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: target_type, in: query, schema: { type: string, enum: [user, role] } }
        - { name: target_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated audit records. Requires an active Admin with audit.view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/admin/access-audit-logs/{log}:
    get:
      tags: [Audit]
      summary: Get one access audit record
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: log, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Audit record and permitted before and after values.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  /api/admin/audit-logs:
    get:
      tags: [Audit]
      summary: List operational audit records, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: action, in: query, schema: { type: string, maxLength: 64 } }
        - { name: actor_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: target_type, in: query, schema: { type: string, enum: [order, customer, product] } }
        - { name: target_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Paginated audit records. Requires an active Admin with audit.view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/admin/audit-logs/{log}:
    get:
      tags: [Audit]
      summary: Get one operational audit record
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: log, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Audit record and permitted before and after values.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Send the opaque Sanctum access token returned by login in the Authorization header.

  parameters:
    AdminRoleId:
      name: role
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: Role ID.

    CustomerId:
      name: customer
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: Customer ID.

    ProductId:
      name: product
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: Product ID.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
        device_name:
          type: [string, 'null']
          maxLength: 100
          description: Optional token label. The server uses AUTH_DEFAULT_TOKEN_NAME when omitted or null.

    PublicUser:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        email: { type: string, format: email }

    ApiEnvelope:
      type: object
      additionalProperties: false
      required: [success, message, data, errors, meta]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { type: [object, array, 'null'] }
        errors: { type: [object, 'null'] }
        meta: { type: [object, 'null'] }

    SuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - properties:
            success: { const: true }
            errors: { type: 'null' }

    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, const: ok }

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data:
              type: object
              additionalProperties: false
              required: [access_token, expires_at, user]
              properties:
                access_token:
                  type: string
                  minLength: 1
                  description: Secret Bearer token returned at issuance.
                expires_at:
                  type: string
                  format: date-time
                  description: Token expiry at issuance, expressed in UTC.
                user:
                  $ref: '#/components/schemas/PublicUser'

    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, name, email, roles, permissions]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Sorted role names. Empty when no roles are assigned.
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
          description: >
            Sorted effective permission names from assigned roles and direct grants.
            Empty when the user has no grants.

    CurrentUserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data:
              type: object
              additionalProperties: false
              required: [user]
              properties:
                user:
                  $ref: '#/components/schemas/CurrentUser'

    LogoutResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data: { type: 'null' }

    StoreUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 1024
          description: >
            Passwords containing null bytes fail validation. With bcrypt, the
            maximum is 72 bytes or the lower positive BCRYPT_LIMIT, if configured.

    UpdateUserRequest:
      type: object
      anyOf:
        - required: [name]
        - required: [email]
      properties:
        name: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
        email: { type: string, format: email, maxLength: 254 }

    AssignUserRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
          description: Existing role names with exact spelling. An empty list clears all roles when permitted.

    AssignUserPermissionsRequest:
      type: object
      required: [direct_permissions]
      properties:
        direct_permissions:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
          description: Existing permission keys with exact spelling. An empty list clears direct grants.
      not:
        required: [inherited_permissions]

    AdminUserPermissionsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data:
              type: object
              required: [user_id, direct_permissions, inherited_permissions]
              properties:
                user_id: { type: integer, format: int64, minimum: 1 }
                direct_permissions:
                  type: array
                  uniqueItems: true
                  items: { type: string }
                  description: Grants assigned directly to the user.
                inherited_permissions:
                  type: array
                  readOnly: true
                  uniqueItems: true
                  items: { type: string }
                  description: Grants from the user's current roles. A key can appear in both lists.

    RoleNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
          description: A custom role name. The names admin, manager, and staff are reserved regardless of case.

    AssignRolePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
          description: Existing permission names with exact spelling. An empty array clears all permissions.

    AdminRole:
      type: object
      additionalProperties: false
      required: [id, name, permissions]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        permissions:
          $ref: '#/components/schemas/PermissionNames'

    PermissionNames:
      type: array
      uniqueItems: true
      items: { type: string }
      description: Sorted permission names.

    AdminRoleListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminRole'
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    AdminRoleResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/AdminRole'
            meta: { type: 'null' }

    AdminPermissionListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [permissions, admin_only_permissions]
              properties:
                permissions:
                  $ref: '#/components/schemas/PermissionNames'
                admin_only_permissions:
                  $ref: '#/components/schemas/PermissionNames'
                  description: Subset of the catalog reserved for the built-in Admin role.
            meta: { type: 'null' }

    AdminUser:
      type: object
      additionalProperties: false
      required: [id, name, email, is_active, roles]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        email: { type: string, format: email }
        is_active: { type: boolean }
        roles:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Sorted role names. Empty when the user has no roles.

    PaginationMeta:
      type: object
      additionalProperties: false
      required: [current_page, per_page, total, last_page]
      properties:
        current_page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        last_page: { type: integer, minimum: 1 }

    AdminUserListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [users]
              properties:
                users:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminUser'
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    AdminUserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [user]
              properties:
                user:
                  $ref: '#/components/schemas/AdminUser'
            meta: { type: 'null' }

    CustomerProfileFields:
      type: object
      not:
        required: [is_active]
      properties:
        name: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        address: { type: [string, 'null'], maxLength: 1000 }

    StoreCustomerRequest:
      allOf:
        - $ref: '#/components/schemas/CustomerProfileFields'
        - required: [name]

    UpdateCustomerRequest:
      allOf:
        - $ref: '#/components/schemas/CustomerProfileFields'
        - anyOf:
            - required: [name]
            - required: [email]
            - required: [phone]
            - required: [address]

    Customer:
      type: object
      additionalProperties: false
      required: [id, name, email, phone, address, is_active]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        is_active: { type: boolean }

    CustomerListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [customers]
              properties:
                customers:
                  type: array
                  items:
                    $ref: '#/components/schemas/Customer'
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    CustomerResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [customer]
              properties:
                customer:
                  $ref: '#/components/schemas/Customer'
            meta: { type: 'null' }

    OrderMinorUnits:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Integer minor units for a two-decimal currency.

    DashboardStatusCounts:
      type: object
      additionalProperties: false
      required: [draft, pending, confirmed, processing, ready, completed, cancelled]
      properties:
        draft: { type: integer, format: int64, minimum: 0 }
        pending: { type: integer, format: int64, minimum: 0 }
        confirmed: { type: integer, format: int64, minimum: 0 }
        processing: { type: integer, format: int64, minimum: 0 }
        ready: { type: integer, format: int64, minimum: 0 }
        completed: { type: integer, format: int64, minimum: 0 }
        cancelled: { type: integer, format: int64, minimum: 0 }

    DashboardFinancialMetric:
      type: object
      additionalProperties: false
      required: [currency, completed_orders, total_revenue_minor, average_order_value_minor]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$', examples: [USD] }
        completed_orders:
          type: integer
          format: int64
          minimum: 0
          description: Number of live completed orders with a completion timestamp in this currency.
        total_revenue_minor:
          type: string
          pattern: '^[0-9]+$'
          description: Exact sum of stored grand totals including tax, expressed as a base-10 integer string in minor currency units.
          examples: ['0', '9007199254740993']
        average_order_value_minor:
          type: integer
          format: int64
          minimum: 0
          description: Total revenue divided by completed orders, rounded half up to the nearest minor unit. Zero when no orders qualify.

    DashboardRecentOrder:
      type: object
      additionalProperties: false
      required: [id, order_number, order_date, status, priority, currency, grand_total_minor]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        order_number: { type: string }
        order_date: { type: string, format: date }
        status: { $ref: '#/components/schemas/OrderStatus' }
        priority: { $ref: '#/components/schemas/OrderPriority' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        grand_total_minor: { type: integer, format: int64, minimum: 0 }

    DashboardResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data:
              type: object
              additionalProperties: false
              required: [total_orders, orders_by_status, total_customers, total_products, financial_metrics, recent_orders]
              properties:
                total_orders: { type: integer, format: int64, minimum: 0 }
                orders_by_status: { $ref: '#/components/schemas/DashboardStatusCounts' }
                total_customers:
                  type: [integer, 'null']
                  format: int64
                  minimum: 0
                  description: Total customer records. Null without customers.view.
                total_products:
                  type: [integer, 'null']
                  format: int64
                  minimum: 0
                  description: Total product records. Null without products.view.
                financial_metrics:
                  type: array
                  minItems: 1
                  description: Currency-level metrics. When there are no eligible orders, there is one zero-valued entry in the configured order currency.
                  items: { $ref: '#/components/schemas/DashboardFinancialMetric' }
                recent_orders:
                  type: array
                  description: A bounded list of the most recent live orders, sorted by business order date descending and ID descending.
                  items: { $ref: '#/components/schemas/DashboardRecentOrder' }

    DashboardRevenuePoint:
      type: object
      additionalProperties: false
      required: [period_start, period_end, revenue_minor, completed_orders]
      properties:
        period_start:
          type: string
          format: date
          description: First included local date.
        period_end:
          type: string
          format: date
          description: Last included local date.
        revenue_minor:
          type: string
          pattern: '^[0-9]+$'
          description: Exact revenue in minor currency units for the bucket, expressed as a base-10 integer string.
          examples: ['0', '9007199254740993']
        completed_orders: { type: integer, format: int64, minimum: 0 }

    DashboardRevenueSeries:
      type: object
      additionalProperties: false
      required: [currency, points]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        points:
          type: array
          minItems: 1
          description: Periods in ascending chronological order.
          items: { $ref: '#/components/schemas/DashboardRevenuePoint' }

    DashboardRevenueTrendResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data:
              type: object
              additionalProperties: false
              required: [group_by, timezone, date_from, date_to, series]
              properties:
                group_by: { type: string, enum: [day, week, month] }
                timezone:
                  type: string
                  description: The reporting timezone used for date boundaries and bucket labels.
                  examples: [UTC, Asia/Kolkata]
                date_from: { type: string, format: date }
                date_to: { type: string, format: date }
                series:
                  type: array
                  minItems: 1
                  description: One series per qualifying stored currency. If the range is empty, one zero-filled series uses the configured order currency.
                  items: { $ref: '#/components/schemas/DashboardRevenueSeries' }


    OrderPriority:
      type: string
      enum: [low, normal, high, urgent]

    OrderTaxRateBasisPoints:
      type: [integer, 'null']
      minimum: 0
      maximum: 10000
      examples: [0, 1000, null]
      description: >-
        Optional order-wide tax rate. 1000 represents 10 percent. A numeric rate applies once to the order amount after
        item and order discounts, and the rounded tax is allocated to the items. Zero yields zero tax. Null uses item rates.

    OrderItemInput:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id: { type: integer, format: int64, minimum: 1 }
        quantity: { type: integer, minimum: 1, maximum: 2147483647 }
        item_discount_minor: { $ref: '#/components/schemas/OrderMinorUnits', default: 0 }
        tax_rate_basis_points:
          type: integer
          minimum: 0
          maximum: 10000
          examples: [0, 1800]
          description: >-
            Optional tax rate override. 1800 means 18 percent and 0 means no tax. Omit to use the current catalog rate for a new line
            or the saved base rate for an existing line. An explicit value requires orders.update. Omit this field if an order tax rate
            is supplied or remains in effect.

    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [customer_id, order_date, items]
      properties:
        customer_id: { type: integer, format: int64, minimum: 1 }
        order_date: { type: string, format: date }
        priority: { $ref: '#/components/schemas/OrderPriority', default: normal }
        assignee_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        note: { type: [string, 'null'], maxLength: 10000 }
        order_discount_minor: { $ref: '#/components/schemas/OrderMinorUnits', default: 0 }
        order_tax_rate_basis_points: { $ref: '#/components/schemas/OrderTaxRateBasisPoints' }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          description: Distinct products. The deployed item limit defaults to 100 and is configurable.
          items:
            $ref: '#/components/schemas/OrderItemInput'

    UpdateOrderRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        customer_id: { type: integer, format: int64, minimum: 1 }
        order_date: { type: string, format: date }
        priority: { $ref: '#/components/schemas/OrderPriority' }
        order_discount_minor: { $ref: '#/components/schemas/OrderMinorUnits' }
        order_tax_rate_basis_points: { $ref: '#/components/schemas/OrderTaxRateBasisPoints' }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          description: Distinct products. The deployed item limit defaults to 100 and is configurable.
          items:
            $ref: '#/components/schemas/OrderItemInput'
      minProperties: 2

    OrderPricingPreviewRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        order_id: { type: integer, format: int64, minimum: 1 }
        order_discount_minor: { $ref: '#/components/schemas/OrderMinorUnits' }
        order_tax_rate_basis_points: { $ref: '#/components/schemas/OrderTaxRateBasisPoints' }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          description: Distinct products. The deployed item limit defaults to 100 and is configurable.
          items:
            $ref: '#/components/schemas/OrderItemInput'

    OrderActor:
