    OrderSummary:
      type: object
      required: [currency, subtotal_minor, order_discount_minor, discount_total_minor, order_tax_rate_basis_points, tax_total_minor, grand_total_minor, id, order_number, customer_id, assignee_id, order_date, priority, status, version, created_at, updated_at, completed_at, customer, assignee]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotal_minor: { $ref: '#/components/schemas/OrderMinorUnits' }
        order_discount_minor: { $ref: '#/components/schemas/OrderMinorUnits' }
        discount_total_minor: { $ref: '#/components/schemas/OrderMinorUnits' }
