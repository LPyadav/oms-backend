        new_assignee_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        actor_id: { type: integer, format: int64, minimum: 1 }
        actor_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    OrderSystemActivityEntry:
