openapi: '3.1.0'

info:
  title: OMS Backend API
  version: '0.1.0'
  description: |
    Order Management System health, authentication, and Admin user management endpoints.

    All registered API routes share a default limit of 120 requests per
    minute per client IP. Requests rejected for missing or invalid
    authentication also count toward this quota.

    Login applies two additional limits: 30 requests per minute per IP
    and 5 requests per minute per normalized email across IPs. Email
    normalization trims whitespace and lowercases the value.

    Deployments can configure these limits with RATE_LIMIT_API_PER_IP,
    RATE_LIMIT_LOGIN_PER_IP, and RATE_LIMIT_LOGIN_PER_EMAIL.
    On HTTP 429, wait for the number of seconds in Retry-After.

servers:
  - url: http://127.0.0.1:8000
    description: Local development

security:
  - BearerAuth: []

paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getApiHealth
      summary: Check API health
      security: []
      responses:
        '200':
          description: API health check succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Issue a Bearer token
      description: |
        Reads credentials from the request body. A successful login
        returns an opaque Sanctum token, its expiry, and the public user
        profile. The token lifetime defaults to 60 minutes and is
        configurable through SANCTUM_TOKEN_EXPIRATION_MINUTES.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: reviewer@example.test
              password: '<local-password>'
              device_name: OMS Web
      responses:
        '200':
          description: Login succeeded and a token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated user
      responses:
        '200':
          description: Current user's public profile, roles, and effective permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current Bearer token
      description: Revokes the token used for this request. Other device tokens remain valid until their own expiry or revocation.
      responses:
        '200':
          description: The current token was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users:
    get:
      tags: [Admin Users]
      operationId: listAdminUsers
      summary: List users
      description: Requires an active Admin with the users.manage permission. Users are ordered by ID.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: One-based page number.
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1 }
          description: >
            Deployment defaults are 25 users per page and a maximum of 100.
            Configured through PAGINATION_USERS_DEFAULT_PER_PAGE and PAGINATION_USERS_MAX_PER_PAGE.
      responses:
        '200':
          description: A page of users and its pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: One or more pagination query parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Admin Users]
      operationId: createAdminUser
      summary: Create a user
      description: Requires an active Admin with the users.manage permission. New users are active with empty role lists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUserRequest'
      responses:
        '201':
          description: The user was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateUserEmail'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users/{user}:
    patch:
      tags: [Admin Users]
      operationId: updateAdminUser
      summary: Update a user's profile
      description: Requires an active Admin with the users.manage permission. Updates only the profile fields supplied in the body.
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: User ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The user's profile was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/DuplicateUserEmail'
        '422':
          description: One or more profile fields in the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users/{user}/disable:
    patch:
      tags: [Admin Users]
      operationId: disableAdminUser
      summary: Disable a user account
      description: >
        Requires an active Admin with the users.manage permission.
        Disables the account and revokes all of the user's existing Bearer tokens.
        The request body can be omitted.
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: User ID.
      responses:
        '200':
          description: The account was disabled and its tokens were revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminUserResponse'
                  - properties:
                      data:
                        properties:
                          user:
                            properties:
                              is_active: { const: false }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/LastActiveAdminConflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users/{user}/roles:
    patch:
      tags: [Admin Users]
      operationId: assignAdminUserRoles
      summary: Replace a user's assigned roles
      description: >-
        Requires an active Admin with both the users.manage and roles.manage
        permissions. Authorization runs before the target user is looked up.
        Replaces the entire role set with the supplied role names. An empty list
        clears all assigned roles when permitted. Each change records the acting
        Admin, target user, and before and after role sets in the same transaction.
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: User ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRolesRequest'
            examples:
              replace:
                summary: Replace the user's roles
                value:
                  roles: [manager, staff]
              clear:
                summary: Clear all assigned roles
                value:
                  roles: []
      responses:
        '200':
          description: The target user with their resulting roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/LastActiveAdminConflict'
        '422':
          description: The roles list in the request body is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Send the opaque Sanctum access token returned by login in the Authorization header.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
        device_name:
          type: [string, 'null']
          maxLength: 100
          description: Optional token label. The server uses AUTH_DEFAULT_TOKEN_NAME when omitted or null.

    PublicUser:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        email: { type: string, format: email }

    ApiEnvelope:
      type: object
      additionalProperties: false
      required: [success, message, data, errors, meta]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { type: [object, array, 'null'] }
        errors: { type: [object, 'null'] }
        meta: { type: [object, 'null'] }

    SuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - properties:
            success: { const: true }
            errors: { type: 'null' }

    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, const: ok }

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data:
              type: object
              additionalProperties: false
              required: [access_token, expires_at, user]
              properties:
                access_token:
                  type: string
                  minLength: 1
                  description: Secret Bearer token returned at issuance.
                expires_at:
                  type: string
                  format: date-time
                  description: Token expiry at issuance, expressed in UTC.
                user:
                  $ref: '#/components/schemas/PublicUser'

    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, name, email, roles, permissions]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Sorted role names. Empty when no roles are assigned.
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
          description: >
            Sorted effective permission names from assigned roles and direct grants.
            Empty when the user has no grants.

    CurrentUserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data:
              type: object
              additionalProperties: false
              required: [user]
              properties:
                user:
                  $ref: '#/components/schemas/CurrentUser'

    LogoutResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data: { type: 'null' }

    StoreUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 1024
          description: >
            Passwords containing null bytes fail validation. With bcrypt, the
            maximum is 72 bytes or the lower positive BCRYPT_LIMIT, if configured.

    UpdateUserRequest:
      type: object
      anyOf:
        - required: [name]
        - required: [email]
      properties:
        name: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
        email: { type: string, format: email, maxLength: 254 }

    AssignUserRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
          description: Existing role names with exact spelling. An empty list clears all roles when permitted.

    AdminUser:
      type: object
      additionalProperties: false
      required: [id, name, email, is_active, roles]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        email: { type: string, format: email }
        is_active: { type: boolean }
        roles:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Sorted role names. Empty when the user has no roles.

    PaginationMeta:
      type: object
      additionalProperties: false
      required: [current_page, per_page, total, last_page]
      properties:
        current_page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        last_page: { type: integer, minimum: 1 }

    AdminUserListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [users]
              properties:
                users:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminUser'
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    AdminUserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [user]
              properties:
                user:
                  $ref: '#/components/schemas/AdminUser'
            meta: { type: 'null' }

    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - properties:
            meta: { type: 'null' }
            success: { const: false }
            data: { type: 'null' }
            errors:
              type: object
              additionalProperties: false
              required: [code, fields]
              properties:
                code:
                  type: string
                  enum:
                    - AUTH_INVALID_CREDENTIALS
                    - AUTH_UNAUTHENTICATED
                    - VALIDATION_FAILED
                    - ACCESS_FORBIDDEN
                    - RESOURCE_NOT_FOUND
                    - METHOD_NOT_ALLOWED
                    - LAST_ACTIVE_ADMIN
                    - RATE_LIMIT_EXCEEDED
                    - REQUEST_FAILED
                    - INTERNAL_SERVER_ERROR
                fields:
                  type: object
                  description: Validation messages by field. An empty object when there are no field errors.
                  additionalProperties:
                    type: array
                    items: { type: string }

    ValidationErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - properties:
            errors:
              properties:
                code: { const: VALIDATION_FAILED }

  responses:
    InvalidCredentials:
      description: The email or password is incorrect.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: AUTH_INVALID_CREDENTIALS }

    Unauthenticated:
      description: The Bearer token is missing, invalid, expired, or revoked.
      headers:
        WWW-Authenticate:
          required: true
          schema: { type: string, const: Bearer }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: AUTH_UNAUTHENTICATED }

    Forbidden:
      description: The authenticated user is not permitted to perform this operation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: ACCESS_FORBIDDEN }

    ResourceNotFound:
      description: The requested user could not be found.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: RESOURCE_NOT_FOUND }

    LastActiveAdminConflict:
      description: The operation would leave no active Admin.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: LAST_ACTIVE_ADMIN }
                      fields: { maxProperties: 0 }
          example:
            success: false
            message: At least one active Admin must remain.
            data: null
            errors:
              code: LAST_ACTIVE_ADMIN
              fields: {}
            meta: null

    DuplicateUserEmail:
      description: Another user already has the submitted email address.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ValidationErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      fields:
                        required: [email]

    ValidationFailed:
      description: One or more request body fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
          example:
            success: false
            message: The submitted data is invalid.
            data: null
            errors:
              code: VALIDATION_FAILED
              fields:
                password:
                  - The password field is required.
            meta: null

    RateLimitExceeded:
      description: An applicable API or login quota has been exhausted.
      headers:
        Retry-After:
          description: Seconds until the quota that blocked this request resets.
          required: true
          schema: { type: integer, minimum: 0 }
        X-RateLimit-Limit:
          description: Maximum requests for the quota that blocked this request.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Remaining:
          schema: { type: integer, const: 0 }
        X-RateLimit-Reset:
          description: Unix timestamp when the exhausted quota resets.
          schema: { type: integer, format: int64 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: RATE_LIMIT_EXCEEDED }

    InternalServerError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: INTERNAL_SERVER_ERROR }
