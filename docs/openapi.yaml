openapi: '3.1.0'

info:
  title: OMS Backend API
  version: '0.1.0'
  description: |
    Order Management System health, authentication, access administration, customer management, and product catalog endpoints.

    All registered API routes share a default limit of 120 requests per
    minute per client IP. Requests rejected for missing or invalid
    authentication also count toward this quota.

    Login applies two additional limits: 30 requests per minute per IP
    and 5 requests per minute per normalized email across IPs. Email
    normalization trims whitespace and lowercases the value.

    Deployments can configure these limits with RATE_LIMIT_API_PER_IP,
    RATE_LIMIT_LOGIN_PER_IP, and RATE_LIMIT_LOGIN_PER_EMAIL.
    On HTTP 429, wait for the number of seconds in Retry-After.

servers:
  - url: http://127.0.0.1:8000
    description: Local development

security:
  - BearerAuth: []

paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getApiHealth
      summary: Check API health
      security: []
      responses:
        '200':
          description: API health check succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Issue a Bearer token
      description: |
        Reads credentials from the request body. A successful login
        returns an opaque Sanctum token, its expiry, and the public user
        profile. The token lifetime defaults to 60 minutes and is
        configurable through SANCTUM_TOKEN_EXPIRATION_MINUTES.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: reviewer@example.test
              password: '<local-password>'
              device_name: OMS Web
      responses:
        '200':
          description: Login succeeded and a token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated user
      responses:
        '200':
          description: Current user's public profile, roles, and effective permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current Bearer token
      description: Revokes the token used for this request. Other device tokens remain valid until their own expiry or revocation.
      responses:
        '200':
          description: The current token was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users:
    get:
      tags: [Admin Users]
      operationId: listAdminUsers
      summary: List users
      description: Requires an active Admin with the users.manage permission. Users are ordered by ID.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: One-based page number.
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1 }
          description: >
            Deployment defaults are 25 users per page and a maximum of 100.
            Configured through PAGINATION_USERS_DEFAULT_PER_PAGE and PAGINATION_USERS_MAX_PER_PAGE.
      responses:
        '200':
          description: A page of users and its pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: One or more pagination query parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Admin Users]
      operationId: createAdminUser
      summary: Create a user
      description: Requires an active Admin with the users.manage permission. New users are active with empty role lists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUserRequest'
      responses:
        '201':
          description: The user was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateUserEmail'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users/{user}:
    patch:
      tags: [Admin Users]
      operationId: updateAdminUser
      summary: Update a user's profile
      description: >
        Requires an active Admin with the users.manage permission.
        Authorization is checked before the target user is looked up.
        Updates only the profile fields supplied in the body.
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: User ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The user's profile was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/DuplicateUserEmail'
        '422':
          description: One or more profile fields in the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users/{user}/disable:
    patch:
      tags: [Admin Users]
      operationId: disableAdminUser
      summary: Disable a user account
      description: >
        Requires an active Admin with the users.manage permission.
        Authorization is checked before the target user is looked up.
        Disables the account and revokes all of the user's existing Bearer tokens.
        The request body can be omitted.
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: User ID.
      responses:
        '200':
          description: The account was disabled and its tokens were revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminUserResponse'
                  - properties:
                      data:
                        properties:
                          user:
                            properties:
                              is_active: { const: false }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/LastActiveAdminConflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/users/{user}/roles:
    patch:
      tags: [Admin Users]
      operationId: assignAdminUserRoles
      summary: Replace a user's assigned roles
      description: >-
        Requires an active Admin with both the users.manage and roles.manage
        permissions. Authorization runs before the target user is looked up.
        Replaces the entire role set with the supplied role names. An empty list
        clears all assigned roles when permitted. Each change records the acting
        Admin, target user, and before and after role sets in the same transaction.
      parameters:
        - name: user
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: User ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRolesRequest'
            examples:
              replace:
                summary: Replace the user's roles
                value:
                  roles: [manager, staff]
              clear:
                summary: Clear all assigned roles
                value:
                  roles: []
      responses:
        '200':
          description: The target user with their resulting roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/LastActiveAdminConflict'
        '422':
          description: The roles list in the request body is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/roles:
    get:
      tags: [Admin Roles]
      operationId: listAdminRoles
      summary: List roles
      description: Requires an active Admin with the roles.manage permission. Roles in the application's guard are ordered by ID.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: One-based page number.
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1 }
          description: >-
            Deployment defaults are 25 roles per page and a maximum of 100.
            Configured through PAGINATION_ROLES_DEFAULT_PER_PAGE and PAGINATION_ROLES_MAX_PER_PAGE.
      responses:
        '200':
          description: A page of roles with their permissions and pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoleListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: One or more pagination query parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Admin Roles]
      operationId: createAdminRole
      summary: Create a custom role
      description: >-
        Requires an active Admin with the roles.manage permission.
        A new role starts with no permissions. The creation is audited in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleNameRequest'
      responses:
        '201':
          description: The custom role was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoleResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateRoleName'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/roles/{role}:
    parameters:
      - $ref: '#/components/parameters/AdminRoleId'
    patch:
      tags: [Admin Roles]
      operationId: renameAdminRole
      summary: Rename a custom role
      description: >-
        Requires an active Admin with the roles.manage permission.
        Authorization runs before the target role is looked up.
        Renaming preserves permissions and user assignments and records the old and new names in the same transaction.
        Submitting the current name leaves the role and its audit history unchanged.
        The built-in admin, manager, and staff roles are protected from renaming.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleNameRequest'
      responses:
        '200':
          description: The role with its current name and permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoleResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/DuplicateRoleName'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/roles/{role}/permissions:
    parameters:
      - $ref: '#/components/parameters/AdminRoleId'
    patch:
      tags: [Admin Roles]
      operationId: replaceAdminRolePermissions
      summary: Replace a custom role's permissions
      description: >-
        Requires an active Admin with the roles.manage permission.
        Authorization runs before the target role is looked up.
        Replaces the full set of permissions on a custom role.
        An empty array clears the set. Each change records the acting Admin, role,
        and before and after permissions in the same transaction. An unchanged set
        returns the role without an additional audit entry. Permissions on the
        built-in admin, manager, and staff roles are protected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRolePermissionsRequest'
            examples:
              replace:
                summary: Replace the role's permissions
                value:
                  permissions: [orders.create, orders.assign]
              clear:
                summary: Clear the role's permissions
                value:
                  permissions: []
      responses:
        '200':
          description: The role with its resulting permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoleResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          description: The permissions list is missing, malformed, or contains invalid names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/admin/permissions:
    get:
      tags: [Admin Roles]
      operationId: listAdminPermissions
      summary: List assignable permissions
      description: Requires an active Admin with the roles.manage permission. Returns permission names defined for the application's guard.
      responses:
        '200':
          description: The list of available permission names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPermissionListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers
      description: Requires an active user with customers.view. Customers are ordered by ID.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
          description: Literal substring search across name, email, and phone.
        - name: is_active
          in: query
          schema: { type: integer, enum: [0, 1] }
          description: Filter by inactive (0) or active (1) customers. Omit to include both.
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: One-based page number.
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1 }
          description: >-
            Deployment defaults are 25 customers per page and a maximum of 100.
            Configured through PAGINATION_CUSTOMERS_DEFAULT_PER_PAGE and PAGINATION_CUSTOMERS_MAX_PER_PAGE.
      responses:
        '200':
          description: A page of customers and its pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      description: >-
        Requires an active Admin with customers.manage.
        The customer starts active. Creation and its audit entry are saved together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCustomerRequest'
      responses:
        '201':
          description: The customer was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/customers/{customer}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get a customer
      description: Requires an active user with customers.view. Authorization precedes customer lookup.
      responses:
        '200':
          description: The customer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update a customer profile
      description: >-
        Requires an active Admin with customers.manage.
        Authorization precedes customer lookup. At least one supported profile field is required.
        Send null to clear a contact field. Changed fields are audited in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: The current customer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/customers/{customer}/deactivate:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    patch:
      tags: [Customers]
      operationId: deactivateCustomer
      summary: Deactivate a customer
      description: >-
        Requires an active Admin with customers.manage.
        Authorization precedes customer lookup. The customer record remains available.
        The status change is audited. Repeating deactivation returns the inactive record.
      responses:
        '200':
          description: The inactive customer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products
      description: Requires an active user with products.view. Products are ordered by ID.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
          description: Literal substring search across name and SKU.
        - name: is_active
          in: query
          schema: { type: integer, enum: [0, 1] }
          description: Filter by inactive (0) or active (1) products. Omit to include both.
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: One-based page number.
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1 }
          description: >-
            Deployment defaults are 25 products per page and a maximum of 100.
            Configured through PAGINATION_PRODUCTS_DEFAULT_PER_PAGE and PAGINATION_PRODUCTS_MAX_PER_PAGE.
      responses:
        '200':
          description: A page of products and its pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      description: >-
        Requires an active Admin with products.manage. The product starts active
        with stock quantity and stock version both set to 0. Creation and its
        audit entry are saved together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProductRequest'
            example:
              sku: WIDGET-01
              name: Steel Widget
              price: '249.95'
              tax_rate: '18.00'
      responses:
        '201':
          description: The product was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateProductSku'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/products/{product}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product
      description: Requires an active user with products.view. Authorization precedes product lookup.
      responses:
        '200':
          description: The product and its current stock balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Update product details
      description: >-
        Requires an active Admin with products.manage. Authorization precedes
        product lookup. Send at least one product detail in the body. Changed
        fields are audited in the same transaction. Use the stock and deactivate
        endpoints to change the balance and active status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: The current product details and stock balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/DuplicateProductSku'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/products/{product}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    patch:
      tags: [Products]
      operationId: deactivateProduct
      summary: Deactivate a product
      description: >-
        Requires an active Admin with products.manage. Authorization precedes
        product lookup. Deactivation preserves the product and its stock balance.
        The status change is audited. Repeating deactivation returns the inactive record.
      responses:
        '200':
          description: The inactive product and its current stock balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/products/{product}/stock:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    patch:
      tags: [Products]
      operationId: adjustProductStock
      summary: Set the counted stock quantity
      description: >-
        Requires an active Admin with products.manage. Authorization precedes product
        lookup. Send the absolute counted quantity and the stock version from the
        current product response. A changed quantity increments the version and
        records a signed stock movement in the same transaction. An unchanged quantity
        with the current version succeeds without a movement. On a version conflict,
        reload the product and reconcile the count before submitting again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustProductStockRequest'
            example:
              stock_quantity: 12
              expected_stock_version: 0
              reason: Physical count
      responses:
        '200':
          description: The product with the current stock balance and version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/StaleProductStockVersion'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Send the opaque Sanctum access token returned by login in the Authorization header.

  parameters:
    AdminRoleId:
      name: role
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: Role ID.

    CustomerId:
      name: customer
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: Customer ID.

    ProductId:
      name: product
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: Product ID.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
        device_name:
          type: [string, 'null']
          maxLength: 100
          description: Optional token label. The server uses AUTH_DEFAULT_TOKEN_NAME when omitted or null.

    PublicUser:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        email: { type: string, format: email }

    ApiEnvelope:
      type: object
      additionalProperties: false
      required: [success, message, data, errors, meta]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { type: [object, array, 'null'] }
        errors: { type: [object, 'null'] }
        meta: { type: [object, 'null'] }

    SuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - properties:
            success: { const: true }
            errors: { type: 'null' }

    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, const: ok }

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data:
              type: object
              additionalProperties: false
              required: [access_token, expires_at, user]
              properties:
                access_token:
                  type: string
                  minLength: 1
                  description: Secret Bearer token returned at issuance.
                expires_at:
                  type: string
                  format: date-time
                  description: Token expiry at issuance, expressed in UTC.
                user:
                  $ref: '#/components/schemas/PublicUser'

    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, name, email, roles, permissions]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Sorted role names. Empty when no roles are assigned.
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
          description: >
            Sorted effective permission names from assigned roles and direct grants.
            Empty when the user has no grants.

    CurrentUserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data:
              type: object
              additionalProperties: false
              required: [user]
              properties:
                user:
                  $ref: '#/components/schemas/CurrentUser'

    LogoutResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            meta: { type: 'null' }
            data: { type: 'null' }

    StoreUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 1024
          description: >
            Passwords containing null bytes fail validation. With bcrypt, the
            maximum is 72 bytes or the lower positive BCRYPT_LIMIT, if configured.

    UpdateUserRequest:
      type: object
      anyOf:
        - required: [name]
        - required: [email]
      properties:
        name: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
        email: { type: string, format: email, maxLength: 254 }

    AssignUserRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
          description: Existing role names with exact spelling. An empty list clears all roles when permitted.

    RoleNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
          description: A custom role name. The names admin, manager, and staff are reserved regardless of case.

    AssignRolePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
          description: Existing permission names with exact spelling. An empty array clears all permissions.

    AdminRole:
      type: object
      additionalProperties: false
      required: [id, name, permissions]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        permissions:
          $ref: '#/components/schemas/PermissionNames'

    PermissionNames:
      type: array
      uniqueItems: true
      items: { type: string }
      description: Sorted permission names.

    AdminRoleListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminRole'
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    AdminRoleResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/AdminRole'
            meta: { type: 'null' }

    AdminPermissionListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [permissions]
              properties:
                permissions:
                  $ref: '#/components/schemas/PermissionNames'
            meta: { type: 'null' }

    AdminUser:
      type: object
      additionalProperties: false
      required: [id, name, email, is_active, roles]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        email: { type: string, format: email }
        is_active: { type: boolean }
        roles:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Sorted role names. Empty when the user has no roles.

    PaginationMeta:
      type: object
      additionalProperties: false
      required: [current_page, per_page, total, last_page]
      properties:
        current_page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        last_page: { type: integer, minimum: 1 }

    AdminUserListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [users]
              properties:
                users:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminUser'
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    AdminUserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [user]
              properties:
                user:
                  $ref: '#/components/schemas/AdminUser'
            meta: { type: 'null' }

    CustomerProfileFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        address: { type: [string, 'null'], maxLength: 1000 }

    StoreCustomerRequest:
      allOf:
        - $ref: '#/components/schemas/CustomerProfileFields'
        - required: [name]

    UpdateCustomerRequest:
      allOf:
        - $ref: '#/components/schemas/CustomerProfileFields'
        - anyOf:
            - required: [name]
            - required: [email]
            - required: [phone]
            - required: [address]

    Customer:
      type: object
      additionalProperties: false
      required: [id, name, email, phone, address, is_active]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        is_active: { type: boolean }

    CustomerListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [customers]
              properties:
                customers:
                  type: array
                  items:
                    $ref: '#/components/schemas/Customer'
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    CustomerResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [customer]
              properties:
                customer:
                  $ref: '#/components/schemas/Customer'
            meta: { type: 'null' }

    ProductMetadataFields:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          description: ASCII SKU. The server trims outer whitespace and normalizes it to uppercase.
        name: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
        price:
          type: string
          pattern: '^[0-9]{1,10}(?:\.[0-9]{1,2})?$'
          description: A decimal string between 0 and 9999999999.99 with up to two decimal places.
        tax_rate:
          type: string
          pattern: '^(?:[0-9]{1,2}(?:\.[0-9]{1,2})?|100(?:\.0{1,2})?)$'
          description: A percentage as a decimal string between 0 and 100 with up to two decimal places.
      not:
        anyOf:
          - required: [stock_quantity]
          - required: [stock_version]
          - required: [is_active]
          - required: [opening_stock]

    StoreProductRequest:
      allOf:
        - $ref: '#/components/schemas/ProductMetadataFields'
        - required: [sku, name, price]
          properties:
            tax_rate: { default: '0.00' }

    UpdateProductRequest:
      allOf:
        - $ref: '#/components/schemas/ProductMetadataFields'
        - anyOf:
            - required: [sku]
            - required: [name]
            - required: [price]
            - required: [tax_rate]

    AdjustProductStockRequest:
      type: object
      required: [stock_quantity, expected_stock_version, reason]
      properties:
        stock_quantity:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Absolute counted stock quantity.
        expected_stock_version:
          type: integer
          format: int64
          minimum: 0
          description: Stock version from the current product response.
        reason: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }

    Product:
      type: object
      additionalProperties: false
      required: [id, sku, name, price, tax_rate, stock_quantity, stock_version, is_active]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        sku: { type: string, maxLength: 64, pattern: '^[A-Z0-9][A-Z0-9._-]*$' }
        name: { type: string }
        price: { type: string, pattern: '^\d+\.\d{2}$', examples: ['249.95'] }
        tax_rate: { type: string, pattern: '^\d+\.\d{2}$', examples: ['18.00'] }
        stock_quantity: { type: integer, minimum: 0, maximum: 2147483647 }
        stock_version: { type: integer, format: int64, minimum: 0 }
        is_active: { type: boolean }

    ProductListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [products]
              properties:
                products:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    ProductResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [product]
              properties:
                product:
                  $ref: '#/components/schemas/Product'
            meta: { type: 'null' }

    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - properties:
            success: { const: false }
            data: { type: 'null' }
            errors:
              type: object
              additionalProperties: false
              required: [code, fields]
              properties:
                code:
                  type: string
                  enum:
                    - AUTH_INVALID_CREDENTIALS
                    - AUTH_UNAUTHENTICATED
                    - VALIDATION_FAILED
                    - ACCESS_FORBIDDEN
                    - RESOURCE_NOT_FOUND
                    - METHOD_NOT_ALLOWED
                    - LAST_ACTIVE_ADMIN
                    - RATE_LIMIT_EXCEEDED
                    - REQUEST_FAILED
                    - INTERNAL_SERVER_ERROR
                fields:
                  type: object
                  description: Validation messages by field. An empty object when there are no field errors.
                  additionalProperties:
                    type: array
                    items: { type: string }

    ValidationErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - properties:
            errors:
              properties:
                code: { const: VALIDATION_FAILED }

  responses:
    InvalidCredentials:
      description: The email or password is incorrect.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: AUTH_INVALID_CREDENTIALS }

    Unauthenticated:
      description: The Bearer token is missing, invalid, expired, or revoked.
      headers:
        WWW-Authenticate:
          required: true
          schema: { type: string, const: Bearer }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: AUTH_UNAUTHENTICATED }

    Forbidden:
      description: The authenticated user is not permitted to perform this operation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: ACCESS_FORBIDDEN }

    ResourceNotFound:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: RESOURCE_NOT_FOUND }

    LastActiveAdminConflict:
      description: The operation would leave no active Admin.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: LAST_ACTIVE_ADMIN }
                      fields: { maxProperties: 0 }
          example:
            success: false
            message: At least one active Admin must remain.
            data: null
            errors:
              code: LAST_ACTIVE_ADMIN
              fields: {}
            meta: null

    DuplicateUserEmail:
      description: Another user already has the submitted email address.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ValidationErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      fields:
                        required: [email]

    DuplicateProductSku:
      description: A product already has the normalized SKU.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ValidationErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      fields:
                        required: [sku]

    StaleProductStockVersion:
      description: >-
        The submitted stock version is stale. The response includes the version
        observed when the update was rejected. Refresh the product and reconcile
        the count before retrying.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ValidationErrorEnvelope'
              - properties:
                  meta:
                    type: object
                    additionalProperties: false
                    required: [stock_version]
                    properties:
                      stock_version: { type: integer, format: int64, minimum: 0 }
                  errors:
                    properties:
                      fields:
                        required: [expected_stock_version]
          example:
            success: false
            message: The submitted data is invalid.
            data: null
            errors:
              code: VALIDATION_FAILED
              fields:
                expected_stock_version:
                  - The stock changed since it was last read. Fetch the product and try again.
            meta:
              stock_version: 2

    DuplicateRoleName:
      description: A role already has the submitted name.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ValidationErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      fields:
                        required: [name]

    ValidationFailed:
      description: One or more request body fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
          example:
            success: false
            message: The submitted data is invalid.
            data: null
            errors:
              code: VALIDATION_FAILED
              fields:
                password:
                  - The password field is required.
            meta: null

    RateLimitExceeded:
      description: An applicable API or login quota has been exhausted.
      headers:
        Retry-After:
          description: Seconds until the quota that blocked this request resets.
          required: true
          schema: { type: integer, minimum: 0 }
        X-RateLimit-Limit:
          description: Maximum requests for the quota that blocked this request.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Remaining:
          schema: { type: integer, const: 0 }
        X-RateLimit-Reset:
          description: Unix timestamp when the exhausted quota resets.
          schema: { type: integer, format: int64 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: RATE_LIMIT_EXCEEDED }

    InternalServerError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: INTERNAL_SERVER_ERROR }
