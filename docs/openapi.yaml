    ProductMetadataFields:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          description: ASCII SKU. The server trims outer whitespace and normalizes it to uppercase.
        name: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }
        price:
          type: string
          pattern: '^[0-9]{1,10}(?:\.[0-9]{1,2})?$'
          description: A decimal string between 0 and 9999999999.99 with up to two decimal places.
        tax_rate:
          type: string
          pattern: '^(?:[0-9]{1,2}(?:\.[0-9]{1,2})?|100(?:\.0{1,2})?)$'
          description: A percentage as a decimal string between 0 and 100 with up to two decimal places.
      not:
        anyOf:
          - required: [stock_quantity]
          - required: [stock_version]
          - required: [is_active]
          - required: [opening_stock]

    StoreProductRequest:
      allOf:
        - $ref: '#/components/schemas/ProductMetadataFields'
        - required: [sku, name, price]
          properties:
            tax_rate: { default: '0.00' }

    UpdateProductRequest:
      allOf:
        - $ref: '#/components/schemas/ProductMetadataFields'
        - anyOf:
            - required: [sku]
            - required: [name]
            - required: [price]
            - required: [tax_rate]

    AdjustProductStockRequest:
      type: object
      required: [stock_quantity, expected_stock_version, reason]
      properties:
        stock_quantity:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Absolute counted stock quantity.
        expected_stock_version:
          type: integer
          format: int64
          minimum: 0
          description: Stock version from the current product response.
        reason: { type: string, minLength: 1, maxLength: 255, pattern: '\S' }

    ReportOrderLabel:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }

    OrderFulfillmentReportRow:
      type: object
      additionalProperties: false
      required: [id, order_number, order_date, customer, priority, status, assignee, currency, grand_total_minor]
      properties:
        id:
          type: integer
          minimum: 1
          description: Use this ID to open the existing order details endpoint.
        order_number: { type: string }
        order_date: { type: string, format: date }
        customer: { $ref: '#/components/schemas/ReportOrderLabel' }
        priority: { type: string, enum: [low, normal, high, urgent] }
        status: { type: string, enum: [draft, pending, confirmed, processing, ready, completed, cancelled] }
        assignee:
          oneOf:
            - $ref: '#/components/schemas/ReportOrderLabel'
            - type: 'null'
        currency: { type: string, pattern: '^[A-Z]{3}$', example: USD }
        grand_total_minor:
          type: integer
          minimum: 0
          description: The stored order total in the smallest unit of its currency.

    OrderFulfillmentReportCurrencyTotal:
      type: object
      additionalProperties: false
      required: [currency, order_count, grand_total_minor]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$', example: USD }
        order_count: { type: integer, minimum: 1 }
        grand_total_minor:
          type: string
          pattern: '^[0-9]+$'
          description: Exact sum of stored order totals in this currency, expressed as a base-10 integer string.
          example: '18014398509481982'

    OrderFulfillmentReportResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: object
              required: [orders, totals]
              properties:
                orders:
                  type: array
                  items: { $ref: '#/components/schemas/OrderFulfillmentReportRow' }
                totals:
                  type: object
                  required: [order_count, by_currency]
                  properties:
                    order_count:
                      type: integer
                      minimum: 0
                      description: Number of matching orders across all pages.
                    by_currency:
                      type: array
                      description: Totals across all filtered rows, sorted by currency code. An empty result is an empty list.
                      items: { $ref: '#/components/schemas/OrderFulfillmentReportCurrencyTotal' }
            meta:
              type: object
              additionalProperties: false
              required: [current_page, per_page, total, last_page, snapshot_at, date_from, date_to]
              properties:
                current_page: { type: integer, minimum: 1 }
                per_page: { type: integer, minimum: 1 }
                total: { type: integer, minimum: 0 }
                last_page: { type: integer, minimum: 1 }
                snapshot_at:
                  type: string
                  format: date-time
                  description: UTC timestamp of this response's report snapshot. Each page request opens its own snapshot.
                date_from: { type: string, format: date }
                date_to: { type: string, format: date }

    SalesTaxReportOrder:
      type: object
      additionalProperties: false
      required: [id, order_number, completed_at, customer, currency, subtotal_minor, item_discount_minor, order_discount_minor, net_total_minor, tax_total_minor, grand_total_minor]
      properties:
        id:
          type: integer
          minimum: 1
          description: Use this ID to open the existing order details endpoint.
        order_number: { type: string }
        completed_at:
          type: string
          format: date-time
          description: Completion time in UTC.
        customer: { $ref: '#/components/schemas/ReportOrderLabel' }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: USD }
        subtotal_minor: { $ref: '#/components/schemas/OrderMinorUnits' }
        item_discount_minor:
          $ref: '#/components/schemas/OrderMinorUnits'
          description: Saved combined discount less the saved order discount.
        order_discount_minor: { $ref: '#/components/schemas/OrderMinorUnits' }
        net_total_minor:
          $ref: '#/components/schemas/OrderMinorUnits'
          description: Saved subtotal less the saved combined discount.
        tax_total_minor:
          $ref: '#/components/schemas/OrderMinorUnits'
          description: Tax stored on the completed order.
        grand_total_minor:
          $ref: '#/components/schemas/OrderMinorUnits'
          description: Realized total stored on the completed order, including tax.

    SalesTaxReportAggregateAmount:
      type: string
      pattern: '^[0-9]+$'
      description: Sum of integer minor units, expressed as an exact base-10 string.
      example: '18014398509481982'

    SalesTaxReportCurrencyTotal:
      type: object
      additionalProperties: false
      required: [currency, order_count, subtotal_minor, item_discount_minor, order_discount_minor, net_total_minor, tax_total_minor, grand_total_minor]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$', example: USD }
        order_count: { type: integer, minimum: 1 }
        subtotal_minor: { $ref: '#/components/schemas/SalesTaxReportAggregateAmount' }
        item_discount_minor: { $ref: '#/components/schemas/SalesTaxReportAggregateAmount' }
        order_discount_minor: { $ref: '#/components/schemas/SalesTaxReportAggregateAmount' }
        net_total_minor: { $ref: '#/components/schemas/SalesTaxReportAggregateAmount' }
        tax_total_minor: { $ref: '#/components/schemas/SalesTaxReportAggregateAmount' }
        grand_total_minor: { $ref: '#/components/schemas/SalesTaxReportAggregateAmount' }

    SalesTaxReportResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [orders, totals]
              properties:
                orders:
                  type: array
                  items: { $ref: '#/components/schemas/SalesTaxReportOrder' }
                totals:
                  type: object
                  additionalProperties: false
                  required: [order_count, by_currency]
                  properties:
                    order_count:
                      type: integer
                      minimum: 0
                      description: Number of matching completed orders across all pages.
                    by_currency:
                      type: array
                      description: All-filter totals by stored currency, sorted by currency code. An empty result has an empty list.
                      items: { $ref: '#/components/schemas/SalesTaxReportCurrencyTotal' }
            meta:
              type: object
              additionalProperties: false
              required: [current_page, per_page, total, last_page, snapshot_at, date_from, date_to, timezone]
              properties:
                current_page: { type: integer, minimum: 1 }
                per_page: { type: integer, minimum: 1 }
                total: { type: integer, minimum: 0 }
                last_page: { type: integer, minimum: 1 }
                snapshot_at:
                  type: string
                  format: date-time
                  description: UTC timestamp of this response's report snapshot. Each page request opens its own snapshot.
                date_from: { type: string, format: date }
                date_to: { type: string, format: date }
                timezone:
                  type: string
                  description: IANA timezone used to interpret the local date range.
                  example: America/New_York

    Product:
      type: object
      additionalProperties: false
      required: [id, sku, name, price, tax_rate, stock_quantity, stock_version, is_active]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        sku: { type: string, maxLength: 64, pattern: '^[A-Z0-9][A-Z0-9._-]*$' }
        name: { type: string }
        price: { type: string, pattern: '^\d+\.\d{2}$', examples: ['249.95'] }
        tax_rate: { type: string, pattern: '^\d+\.\d{2}$', examples: ['18.00'] }
        stock_quantity: { type: integer, minimum: 0, maximum: 2147483647 }
        stock_version: { type: integer, format: int64, minimum: 0 }
        is_active: { type: boolean }

    ProductListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [products]
              properties:
                products:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    ProductResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [product]
              properties:
                product:
                  $ref: '#/components/schemas/Product'
            meta: { type: 'null' }

    CommandSuccess:
      type: object
      required: [success, message, data]
      properties:
        success: { const: true }
        message: { type: string }
        data: { type: 'null' }

    CustomerOrderSummaryResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { const: true }
        message: { type: string }
        data:
          type: object
          required: [order_summary]
          properties:
            order_summary:
              type: object
              required: [total_orders, pending_orders, completed_orders, cancelled_orders, total_value_by_currency, recent_orders]
              properties:
                total_orders: { type: integer, minimum: 0 }
                pending_orders: { type: integer, minimum: 0 }
                completed_orders: { type: integer, minimum: 0 }
                cancelled_orders: { type: integer, minimum: 0 }
                total_value_by_currency:
                  type: array
                  items:
                    type: object
                    required: [currency, total_minor]
                    properties:
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
                      total_minor: { type: string, pattern: '^[0-9]+$' }
                recent_orders:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [id, order_number, order_date, status, currency, grand_total_minor]
                    properties:
                      id: { type: integer, minimum: 1 }
                      order_number: { type: string }
                      order_date: { type: string, format: date }
                      status: { $ref: '#/components/schemas/OrderStatus' }
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
                      grand_total_minor: { $ref: '#/components/schemas/OrderMinorUnits' }

    AuditLog:
      type: object
      required: [id, actor_id, target_type, target_id, action, created_at]
      properties:
        id: { type: integer, minimum: 1 }
        actor_id: { type: integer, minimum: 1 }
        actor_name: { type: [string, 'null'] }
        target_type: { type: string, enum: [user, role, order, customer, product] }
        target_id: { type: integer, minimum: 1 }
        action: { type: string }
        created_at: { type: string, format: date-time }
        before_values: { type: [object, 'null'] }
        after_values: { type: object }

    AuditLogListResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success: { const: true }
        message: { type: string }
        data:
          type: object
          required: [logs]
          properties:
            logs:
              type: array
              items: { $ref: '#/components/schemas/AuditLog' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    AuditLogResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { const: true }
        message: { type: string }
        data:
          type: object
          required: [log]
          properties:
            log: { $ref: '#/components/schemas/AuditLog' }

    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - properties:
            success: { const: false }
            data: { type: 'null' }
            errors:
              type: object
              additionalProperties: false
              required: [code, fields]
              properties:
                code:
                  type: string
                  enum:
                    - AUTH_INVALID_CREDENTIALS
                    - AUTH_UNAUTHENTICATED
                    - VALIDATION_FAILED
                    - ACCESS_FORBIDDEN
                    - RESOURCE_NOT_FOUND
                    - METHOD_NOT_ALLOWED
                    - LAST_ACTIVE_ADMIN
                    - ORDER_VERSION_CONFLICT
                    - ORDER_IDEMPOTENCY_CONFLICT
                    - RATE_LIMIT_EXCEEDED
                    - REQUEST_FAILED
                    - WRITE_CONTENTION
                    - INTERNAL_SERVER_ERROR
                fields:
                  type: object
                  description: Validation messages by field. An empty object when there are no field errors.
                  additionalProperties:
                    type: array
                    items: { type: string }

    ValidationErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - properties:
            errors:
              properties:
                code: { const: VALIDATION_FAILED }

  responses:
    InvalidCredentials:
      description: The email or password is incorrect.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: AUTH_INVALID_CREDENTIALS }

    Unauthenticated:
      description: The Bearer token is missing, invalid, expired, or revoked.
      headers:
        WWW-Authenticate:
          required: true
          schema: { type: string, const: Bearer }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: AUTH_UNAUTHENTICATED }

    Forbidden:
      description: The authenticated user is not permitted to perform this operation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: ACCESS_FORBIDDEN }

    ResourceNotFound:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: RESOURCE_NOT_FOUND }

    LastActiveAdminConflict:
      description: The operation would leave no active Admin.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: LAST_ACTIVE_ADMIN }
                      fields: { maxProperties: 0 }
          example:
            success: false
            message: At least one active Admin must remain.
            data: null
            errors:
              code: LAST_ACTIVE_ADMIN
              fields: {}
            meta: null

    DuplicateUserEmail:
      description: Another user already has the submitted email address.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ValidationErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      fields:
                        required: [email]

    DuplicateProductSku:
      description: A product already has the normalized SKU.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ValidationErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      fields:
                        required: [sku]

    StaleProductStockVersion:
      description: >-
        The submitted stock version is stale. The response includes the version
        observed when the update was rejected. Refresh the product and reconcile
        the count before retrying.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ValidationErrorEnvelope'
              - properties:
                  meta:
                    type: object
                    additionalProperties: false
                    required: [stock_version]
                    properties:
                      stock_version: { type: integer, format: int64, minimum: 0 }
                  errors:
                    properties:
                      fields:
                        required: [expected_stock_version]
          example:
            success: false
            message: The submitted data is invalid.
            data: null
            errors:
              code: VALIDATION_FAILED
              fields:
                expected_stock_version:
                  - The stock changed since it was last read. Fetch the product and try again.
            meta:
              stock_version: 2

    DuplicateRoleName:
      description: A role already has the submitted name.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ValidationErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      fields:
                        required: [name]

    OrderIdempotencyConflict:
      description: The caller already used this Idempotency-Key with a different validated order creation payload.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: ORDER_IDEMPOTENCY_CONFLICT }
          example:
            success: false
            message: This idempotency key has already been used with a different order request.
            data: null
            errors:
              code: ORDER_IDEMPOTENCY_CONFLICT
              fields: {}
            meta: null

    OrderVersionConflict:
      description: The supplied expected_version differs from the current saved order version.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: The order changed since it was last read. Fetch the order and try again.
            data: null
            errors:
              code: ORDER_VERSION_CONFLICT
              fields:
                expected_version: [The order changed since it was last read. Fetch the order and try again.]
            meta: { version: 2 }

    ValidationFailed:
      description: One or more request body fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
          example:
            success: false
            message: The submitted data is invalid.
            data: null
            errors:
              code: VALIDATION_FAILED
              fields:
                password:
                  - The password field is required.
            meta: null

    RateLimitExceeded:
      description: An applicable API or login quota has been exhausted.
      headers:
        Retry-After:
          description: Seconds until the quota that blocked this request resets.
          required: true
          schema: { type: integer, minimum: 0 }
        X-RateLimit-Limit:
          description: Maximum requests for the quota that blocked this request.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Remaining:
          schema: { type: integer, const: 0 }
        X-RateLimit-Reset:
          description: Unix timestamp when the exhausted quota resets.
          schema: { type: integer, format: int64 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: RATE_LIMIT_EXCEEDED }

    InternalServerError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: INTERNAL_SERVER_ERROR }

    OrderWriteContention:
      description: The write could not acquire its database locks. Wait for Retry-After before retrying.
      headers:
        Retry-After:
          description: Seconds to wait before retrying the order change.
          required: true
          schema: { type: integer, minimum: 1 }
        X-Request-ID:
          description: Request ID for tracing the contention.
          required: true
          schema: { type: string, format: uuid }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: WRITE_CONTENTION }
                  meta:
                    type: object
                    additionalProperties: false
                    required: [request_id]
                    properties:
                      request_id: { type: string, format: uuid }

    CatalogWriteContention:
      description: The write could not acquire its database locks. Wait for Retry-After before retrying.
      headers:
        Retry-After:
          description: Seconds to wait before retrying the Catalog write.
          required: true
          schema: { type: integer, minimum: 1 }
        X-Request-ID:
          description: Request ID for tracing the contention.
          required: true
          schema: { type: string, format: uuid }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - properties:
                  errors:
                    properties:
                      code: { const: WRITE_CONTENTION }
                  meta:
                    type: object
                    additionalProperties: false
                    required: [request_id]
                    properties:
                      request_id: { type: string, format: uuid }
